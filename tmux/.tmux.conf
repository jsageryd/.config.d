# Status bar
set -g status-style bg=colour236,fg=colour253
set -g status-left ' [#S] '
set -g status-left-length 100

set -g status-right ''

# Mode indicators; these need #{==:} and #{E:}, so gate for tmux >= 3.1.
if-shell 'tmux -V | cut -d" " -f2 | grep -qE "^(3\.([1-9]|[1-9][0-9])|[4-9])"' \
  "set -ga status-right '#{?#{==:#{pane_mode},copy-mode},#[#{E:copy-mode-position-style}] COPY #[default],}' ; \
   set -ga status-right '#{?#{==:#{pane_mode},view-mode},#[#{E:copy-mode-position-style}] VIEW #[default],}' ; \
   set -ga status-right '#{?#{==:#{pane_mode},tree-mode},#[fg=colour232#,bg=colour117] TREE #[default],}' ; \
   set -ga status-right '#{?#{==:#{pane_mode},buffer-mode},#[fg=colour232#,bg=colour141] BUFFER #[default],}' ; \
   set -ga status-right '#{?#{==:#{pane_mode},client-mode},#[fg=colour232#,bg=colour209] CLIENT #[default],}' ; \
   set -ga status-right '#{?#{==:#{pane_mode},options-mode},#[fg=colour232#,bg=colour186] OPTIONS #[default],}' ; \
   set -ga status-right '#{?#{==:#{pane_mode},clock-mode},#[fg=colour232#,bg=colour152] CLOCK #[default],}' ; \
   set -ga status-right '#{?synchronize-panes,#[fg=colour232#,bg=colour114] SYNC #[default],}' ; \
   set -ga status-right '#{?window_zoomed_flag,#[fg=colour232#,bg=colour80] ZOOM #[default],}'"

if-shell 'command -v tmux-tomato > /dev/null 2>&1' \
  "set -ga status-right '#(tmux-tomato)'"

set -ga status-right '#[fg=colour231,bg=colour240] %Y-%m-%d %H:%M '

set -g status-right-length 200

# Time-of-day bar, mirroring the nvim splash. It gets a row of its own because
# an #[align=centre] segment on row 0 competes with the window list, which
# pushes it off centre and truncates it once a few windows are open.
if-shell 'command -v tmux-timebar > /dev/null 2>&1 && tmux -V | cut -d" " -f2 | grep -qE "^([3-9]|[0-9][0-9])\."' \
  "set -g status 2 ; \
   set -g status-format[1] '#[bg=terminal,fill=terminal,align=centre]#(tmux-timebar #{client_width})'"

setw -g window-status-current-style bg=colour240,fg=colour231
setw -g window-status-current-format ' #I:#W#F#{?@window_bookmarked,#[fg=colour221#,bold] ✦#[default],} '

setw -g window-status-style bg=colour233,fg=colour246
setw -g window-status-format ' #I:#W#F#{?@window_bookmarked,#[fg=colour221#,bold] ✦#[default],} '

setw -g window-status-bell-style fg=colour117,bold

# Colour windows needing attention in the tree-mode window list (prefix+w) the
# same way they appear in the status bar. tmux has no option for the tree list
# line format -- tree-mode-preview-{format,style} cover only the preview pane
# and mode-style only the selection bar -- so the default format has to be
# restated via choose-tree -F. Flags: ! = bell, ## = activity, ~ = silence.
set -g  @tree_format ''
set -ga @tree_format '#{?pane_format,'
set -ga @tree_format '#{pane_current_command}#{?pane_active, (active),},'
set -ga @tree_format '#{?window_format,'
set -ga @tree_format '#{?#{m:*!*,#{window_flags}},#[fg=colour117#,bold],'
set -ga @tree_format '#{?#{m:*##*,#{window_flags}},#[reverse],'
set -ga @tree_format '#{?#{m:*~*,#{window_flags}},#[reverse],}}}'
set -ga @tree_format '#{window_name}'
set -ga @tree_format '#{s/\*/#[fg=colour231#,bold] *#[default]/:'
set -ga @tree_format '#{s/-/#[fg=colour209#,bold] -#[default]/:'
set -ga @tree_format '#{s/!/#[fg=colour117#,bold] !#[default]/:'
set -ga @tree_format '#{s/~/#[fg=colour152#,bold] ~#[default]/:'
set -ga @tree_format '#{s/Z/#[fg=colour80#,bold] Z#[default]/:'
set -ga @tree_format '#{s/M/#[fg=colour141#,bold] M#[default]/:'
set -ga @tree_format '#{s/####/#[fg=colour114#,bold] ###[default]/:'
set -ga @tree_format 'window_flags}}}}}}}'
set -ga @tree_format '#[default]'
set -ga @tree_format '#{?@window_bookmarked,#[fg=colour221#,bold] ✦#[default],}'
set -ga @tree_format '#{?#{>:#{window_panes},1},'
set -ga @tree_format '#[fg=colour244] (#{window_panes})#[default],},'
set -ga @tree_format '#{session_windows} windows'
set -ga @tree_format '#{?session_grouped,'
set -ga @tree_format ' (group #{session_group}: #{session_group_list}),}'
set -ga @tree_format '#{?session_attached, (attached),}}}'
if-shell 'tmux -V | cut -d" " -f2 | grep -qE "^(3\.([1-9]|[1-9][0-9])|[4-9])"' \
  "bind w choose-tree -Zw -F '#{E:@tree_format}'"

set -g message-style bg=colour248,fg=colour232
if-shell 'tmux -V | cut -d" " -f2 | grep -qE "^(3\.([7-9]|[1-9][0-9])|[4-9])"' \
  "set -g message-style bg=colour248,fg=colour232,fill=colour248"

# Pane borders
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour250

# Enable mouse
set -g mouse on

# Display messages for 10 seconds
set -g display-time 10000

# Set 256 colour terminal, falling back to screen-256color where the
# tmux-256color terminfo entry is unavailable (ncurses < 6).
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  "set -g default-terminal 'tmux-256color'" \
  "set -g default-terminal 'screen-256color' ; \
   set -ga terminal-overrides ',screen-256color:sitm=\\E[3m:ritm=\\E[23m'"

# Set 24-bit mode for any xterm-256color terminal
set-option -ga terminal-overrides "xterm-256color:RGB"

# Pass focus events through to applications (e.g. nvim autoread)
set -g focus-events on

# Enable styled (undercurl) and coloured underlines so squiggly spell checking
# passes through to the outer terminal (Alacritty supports both).
#
#   Smulx = styled underlines (undercurl, etc.)
#   Setulc = set underline colour
#
set-option -ga terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set-option -ga terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Tell tmux the outer terminal supports RGB.
set-option -ga terminal-overrides ',alacritty:RGB'

# Set scrollback to 10,000 lines
set -g history-limit 10000

# Renumber windows when closed
set -g renumber-windows on

# Automatically rename windows to current directory basename
set -g automatic-rename-format '#{b:pane_current_path}'

# Avoid accidental pane switching
set -g repeat-time 0

# Start window numbering at 1
set -g base-index 1

# Unbind space to avoid to accidentally my panes
unbind-key space

# Unbind meta-1 through meta-5 to avoid accidentally the panes
unbind-key M-1
unbind-key M-2
unbind-key M-3
unbind-key M-4
unbind-key M-5

# Avoid 1 second lag on escape key
set -s escape-time 0

# Make resizing easier
bind -n S-Left resize-pane -L 5
bind -n S-Down resize-pane -D 5
bind -n S-Up resize-pane -U 5
bind -n S-Right resize-pane -R 5

# Set a title for each pane, except if running on the raspi.
# Prepend "[lock]" to the title when the pane is locked (@pane_locked == 1).
if-shell 'uname -m | grep -qv armv7l' \
  'set -g pane-border-status top; \
   set -g pane-border-format "#{?@pane_locked,#[fg=colour203 bold][lock]#[default] ,}#{pane_current_path}"'

# Toggle lock/unlock of the current pane with prefix+§.
# Locking disables input to the pane (select-pane -d) and marks it so the
# border format shows "[lock]".
bind § if-shell -F '#{==:#{@pane_locked},1}' \
  'select-pane -e ; set-option -pu @pane_locked' \
  'select-pane -d ; set-option -p @pane_locked 1'

# Toggle a bookmark on the current window with prefix+b.
bind b if-shell -F '#{==:#{@window_bookmarked},1}' \
  'set-option -wu @window_bookmarked' \
  'set-option -w @window_bookmarked 1'

# Set clock colour
set -g clock-mode-colour colour242

# Use ^b= to toggle synchronize-panes
bind = setw synchronize-panes

# Make it possible to open URLs with ^bu
if-shell -b 'command -v urlview > /dev/null 2>&1' \
  'run-shell $HOME/.tmux/plugins/tmux-urlview/urlview.tmux'

# Create new panes using same working directory as current pane
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Bind prefix+S to create a new session
bind S new-session

# Prevent client from detaching when session is destroyed
set-option -g detach-on-destroy off
